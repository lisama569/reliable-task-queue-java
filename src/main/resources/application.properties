# 本地可靠任务队列配置（进程内存储 + 本地 JSON 快照模拟消息代理，无需外部服务）

# 消费租约时长（秒）：租约到期未 ack/nack，任务将被重新投递给其他消费者
taskqueue.lease-seconds=30

# 最大尝试次数：nack 后 attempts 达到该值即进入死信（DEAD）
taskqueue.max-attempts=3

# 指数退避：第 n 次失败后等待 backoff-base-millis * 2^(n-1)，封顶 max-backoff-millis
taskqueue.backoff-base-millis=200
taskqueue.max-backoff-millis=10000

# 快照文件：每次状态变更后原子覆盖写，用于跨进程重启恢复；置空则为纯内存模式
taskqueue.snapshot-file=target/taskqueue-snapshot.json

# 日志级别：单测/运行日志中会打印任务键与状态流转
logging.level.com.github.lisama569.reliabletaskqueuejava.queue=INFO
